backend:
  name: github
  repo: abda-s/portfolio-template
  branch: main
  # Points at the portfolio-cms-auth Worker: a real email/password login
  # (no GitHub account needed by the client) that looks the client up in
  # D1 and hands Sveltia a GitHub token scoped to just this repo. See
  # ../../../portfolio-cms-auth/README.md for how it works and how to add
  # a client. One Worker + one D1 database is reused across every client
  # repo; each client is a row keyed by email.
  base_url: https://portfolio-cms-auth.3bda-as.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: settings
    label: Site Settings
    files:
      - name: settings
        label: Site Settings
        file: src/content/settings.json
        format: json
        fields:
          - { label: Brand Name, name: brandName, widget: string }
          - { label: Brand Initials, name: brandInitials, widget: string }
          - { label: Meta Title (browser tab / SEO), name: metaTitle, widget: string }
          - { label: Meta Description (SEO), name: metaDescription, widget: text }

          - label: Hero Section
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: 'Title — line 1', name: titleLine1, widget: string }
              - { label: 'Title — line 2', name: titleLine2, widget: string }
              - { label: 'Title — accent (colored suffix)', name: titleAccent, widget: string }
              - { label: Lede paragraph, name: lede, widget: text }
              - { label: Primary button label, name: ctaPrimary, widget: string }
              - { label: Secondary button label, name: ctaSecondary, widget: string }
              - { label: Hero Image, name: image, widget: image, required: false }
              - { label: Hero Image Alt Text, name: imageAlt, widget: string, required: false }
              - { label: 'Caption (left)', name: caption, widget: string, required: false }
              - { label: 'Caption (right)', name: captionRight, widget: string, required: false }
              - label: Stats Strip
                name: stats
                widget: list
                summary: '{{value}} — {{label}}'
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }

          - label: About Section
            name: about
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
              - { label: Body, name: body, widget: text, hint: 'Raw HTML is supported, e.g. <p>, <b>, <strong>' }
              - { label: Side Card Title, name: cardTitle, widget: string }
              - { label: Side Card Revision Tag, name: cardRev, widget: string }
              - label: Spec Rows
                name: specs
                widget: list
                summary: '{{key}}: {{value}}'
                fields:
                  - { label: Key, name: key, widget: string }
                  - { label: Value, name: value, widget: string }

          - label: Skills Section
            name: skills
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
              - { label: Intro, name: intro, widget: text }
              - label: Categories
                name: categories
                widget: list
                summary: '{{title}}'
                fields:
                  - { label: Category Title, name: title, widget: string }
                  - { label: Category Subtitle, name: subtitle, widget: string }
                  - label: Skills
                    name: items
                    widget: list
                    summary: '{{name}} ({{pct}}%)'
                    fields:
                      - { label: Name, name: name, widget: string }
                      - label: Level
                        name: level
                        widget: select
                        options: [Developing, Working, Proficient, Advanced]
                      - { label: 'Percent (0-100)', name: pct, widget: number, min: 0, max: 100, value_type: int }

          - label: Projects Section Intro
            name: projectsSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
              - { label: Intro, name: intro, widget: text }

          - label: Contact Section
            name: contact
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
              - { label: Lede, name: lede, widget: text }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: CV / Resume URL, name: cvUrl, widget: string, required: false }

          - label: Social Links
            name: socials
            widget: list
            summary: '{{label}}'
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Display Text, name: value, widget: string }
              - { label: URL, name: url, widget: string, required: false }

          - label: Footer
            name: footer
            widget: object
            fields:
              - { label: Left Text, name: left, widget: string }
              - { label: Right Text, name: right, widget: string }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — {{subtitle}}'
    fields:
      - { label: Sheet Number, name: sheet, widget: string, hint: "e.g. '01'" }
      - { label: Tag, name: tag, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string }
      - { label: Card Thumbnail, name: thumb, widget: image, required: false }
      - { label: Result Summary, name: result, widget: text }
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Sort Order, name: order, widget: number, value_type: int }
      - label: Metrics
        name: metrics
        widget: list
        summary: '{{value}} — {{label}} ({{placement}})'
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Label, name: label, widget: string }
          - label: Placement
            name: placement
            widget: select
            options: [card, detail]
            hint: '"card" shows on the project grid, "detail" shows on the project page'
      - label: Sections
        name: sections
        widget: list
        summary: '{{number}} — {{heading}}'
        fields:
          - { label: Number, name: number, widget: string, hint: "e.g. '01'" }
          - { label: Heading, name: heading, widget: string }
          - {
              label: Body,
              name: body,
              widget: text,
              hint: 'Raw HTML is supported: <p>, <ul>, <table>, <strong>, etc.',
            }
