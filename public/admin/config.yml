backend:
  name: github
  repo: abda-s/portfolio-template
  branch: main
  # Login itself is handled by index.html, which redirects signed-out
  # visitors to the portfolio-cms-auth Worker's login page (real
  # email/password, no GitHub account needed by the client) and back via
  # Sveltia's built-in magic-link sign-in URL. See
  # ../../../portfolio-cms-auth/README.md. base_url is intentionally not
  # set here — Sveltia's own GitHub-OAuth screen is never shown.

# The site's real, deployed URL. Without this, Sveltia falls back to
# window.location.origin — just the bare domain, no /portfolio-template
# path — which is wrong for a project-page deploy like this one, and
# breaks the "click the logo" / "open live site" links in the CMS.
site_url: https://abda-s.github.io/portfolio-template/

# Send visitors to the live site (not Sveltia's own sign-in screen) after
# they click "Sign out" in the CMS.
logout_redirect_url: https://abda-s.github.io/portfolio-template/

# Replaces the "Sveltia CMS" name/logo in the header, login page, and browser
# tab with our own — the client never sees the underlying CMS's name. (A
# small "Powered by Sveltia CMS" credit stays in the UI footer; Sveltia
# isn't a white-label product, so that one line can't be configured away.)
# UPDATE THE LOGO URL PER CLIENT — it must be an absolute URL, same as
# logout_redirect_url above.
app_title: Portfolio Dashboard
logo:
  src: https://abda-s.github.io/portfolio-template/favicon.svg
  show_in_header: true

media_folder: public/images/uploads
public_folder: /images/uploads

# Every image uploaded through the CMS is converted to WebP and capped at
# 2048px on its longest side, right in the browser before it's committed —
# no build step, no external service, no cost. Uncommitted/existing images
# in the repo aren't touched retroactively; this only applies going forward.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048
      svg:
        optimize: true

# Each page section is its own singleton: one focused screen per real-world
# task ("update my phone number", "reorder skills") instead of one long form
# covering the whole site. Singletons show as individual clicks in the
# sidebar, grouped here to match the order sections appear on the page.
singletons:
  - name: site
    label: Site Info
    icon: language
    file: src/content/settings/site.json
    format: json
    fields:
      - { label: Brand Name, name: brandName, widget: string, hint: 'Shown in the top-left nav, e.g. "Ra''ad Alshawabkeh"' }
      - { label: Brand Initials, name: brandInitials, widget: string, hint: 'Short nav logo text, e.g. "RA"' }
      - { label: Browser Tab Title, name: metaTitle, widget: string, hint: 'Shown in the browser tab and search results' }
      - { label: Search Result Description, name: metaDescription, widget: text, hint: 'The snippet shown under your site in Google search results' }
      - { label: Footer Left Text, name: footerLeft, widget: string, hint: 'e.g. copyright line' }
      - { label: Footer Right Text, name: footerRight, widget: string }

  - divider: true

  - name: hero
    label: Hero (Homepage Intro)
    icon: waving_hand
    file: src/content/settings/hero.json
    format: json
    fields:
      - { label: Eyebrow (small label above title), name: eyebrow, widget: string }
      - { label: 'Title — line 1', name: titleLine1, widget: string }
      - { label: 'Title — line 2', name: titleLine2, widget: string }
      - { label: 'Title — accent (colored suffix on line 2)', name: titleAccent, widget: string }
      - { label: Intro Paragraph, name: lede, widget: text }
      - { label: Primary Button Text, name: ctaPrimary, widget: string, hint: 'Scrolls to the Projects section' }
      - { label: Secondary Button Text, name: ctaSecondary, widget: string, hint: 'Opens your CV/resume, set in Contact & Socials' }
      - { label: Hero Photo, name: image, widget: image, required: false }
      - { label: Hero Photo Alt Text, name: imageAlt, widget: string, required: false, hint: 'Describe the photo for screen readers' }
      - { label: 'Photo Caption (left)', name: caption, widget: string, required: false }
      - { label: 'Photo Caption (right)', name: captionRight, widget: string, required: false }
      - label: Stats Strip
        name: stats
        widget: list
        summary: '{{value}} — {{label}}'
        hint: 'The row of quick numbers under the intro paragraph, e.g. "4 · Engineering projects"'
        fields:
          - { label: Value, name: value, widget: string, hint: 'e.g. "4" or "25.6%"' }
          - { label: Label, name: label, widget: string }

  - name: about
    label: About
    icon: person
    file: src/content/settings/about.json
    format: json
    fields:
      - { label: Eyebrow, name: eyebrow, widget: string }
      - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
      - { label: Body, name: body, widget: markdown, minimal: true, buttons: [bold, italic], hint: 'Use the toolbar for bold/italic — start a new paragraph with a blank line' }
      - { label: Side Card Title, name: cardTitle, widget: string, hint: 'e.g. "Profile"' }
      - { label: Side Card Tag, name: cardRev, widget: string, hint: 'e.g. "Rev. 2026"' }
      - label: Side Card Rows
        name: specs
        widget: list
        summary: '{{key}}: {{value}}'
        hint: 'Key facts shown in the card next to your About text, e.g. "Location: Amman, Jordan"'
        fields:
          - { label: Key, name: key, widget: string }
          - { label: Value, name: value, widget: string }

  - name: skills
    label: Skills
    icon: bar_chart
    file: src/content/settings/skills.json
    format: json
    fields:
      - { label: Eyebrow, name: eyebrow, widget: string }
      - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
      - { label: Intro, name: intro, widget: text }
      - label: Skill Categories
        name: categories
        widget: list
        summary: '{{title}}'
        hint: 'Each category becomes its own card, e.g. "CAD & Design"'
        fields:
          - { label: Category Title, name: title, widget: string }
          - { label: Category Subtitle, name: subtitle, widget: string }
          - label: Skills in this Category
            name: items
            widget: list
            summary: '{{name}} ({{pct}}%)'
            fields:
              - { label: Skill Name, name: name, widget: string }
              - label: Level Label
                name: level
                widget: select
                options: [Developing, Working, Proficient, Advanced]
              - { label: 'Skill Bar (0-100)', name: pct, widget: number, min: 0, max: 100, value_type: int }

  - name: projectsSection
    label: Projects Intro
    icon: work
    file: src/content/settings/projects-section.json
    format: json
    fields:
      - { label: Eyebrow, name: eyebrow, widget: string }
      - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
      - { label: Intro, name: intro, widget: text }

  - name: contact
    label: Contact & Socials
    icon: mail
    file: src/content/settings/contact.json
    format: json
    fields:
      - { label: Eyebrow, name: eyebrow, widget: string }
      - { label: Title, name: title, widget: text, hint: 'Start a new line for a line break' }
      - { label: Intro, name: lede, widget: text }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Phone, name: phone, widget: string, required: false }
      - { label: CV / Resume URL, name: cvUrl, widget: string, required: false }
      - label: Social / Contact Links
        name: socials
        widget: list
        summary: '{{label}}'
        hint: 'Shown as clickable rows in the Contact section, e.g. Email, LinkedIn, GitHub'
        fields:
          - { label: Label, name: label, widget: string, hint: 'e.g. "LinkedIn"' }
          - { label: Display Text, name: value, widget: string, hint: 'Shown to visitors, e.g. "/in/your-name"' }
          - { label: Link URL, name: url, widget: string, required: false }

collections:
  - name: projects
    label: Projects
    icon: construction
    folder: src/content/projects
    create: true
    delete: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — {{subtitle}}'
    fields:
      - { label: Sheet Number, name: sheet, widget: string, hint: "e.g. '01'" }
      - { label: Tag, name: tag, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string }
      - { label: Card Thumbnail, name: thumb, widget: image, required: false }
      - { label: Result Summary, name: result, widget: text }
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Sort Order, name: order, widget: number, value_type: int }
      - label: Metrics
        name: metrics
        widget: list
        summary: '{{value}} — {{label}} ({{placement}})'
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Label, name: label, widget: string }
          - label: Placement
            name: placement
            widget: select
            options: [card, detail]
            hint: '"card" shows on the project grid, "detail" shows on the project page'
      - label: Sections
        name: sections
        widget: list
        summary: '{{number}} — {{heading}}'
        hint: 'Each write-up is a numbered list of sections. Fill in whichever of Text / Table / Highlighted Note a section needs — leave the rest blank.'
        fields:
          - { label: Number, name: number, widget: string, hint: "e.g. '01'" }
          - { label: Heading, name: heading, widget: string }
          - {
              label: Text,
              name: body,
              widget: markdown,
              required: false,
              minimal: true,
              buttons: [bold, italic, bulleted-list, numbered-list],
              hint: 'Use the toolbar for bold/italic/lists — start a new paragraph with a blank line',
            }
          - label: Table
            name: table
            widget: object
            required: false
            hint: 'A simple two-column data table, e.g. a "Results Summary"'
            fields:
              - { label: 'Left Column Header', name: columnOneHeader, widget: string, hint: 'e.g. "Metric"' }
              - { label: 'Right Column Header', name: columnTwoHeader, widget: string, hint: 'e.g. "Result"' }
              - label: Rows
                name: rows
                widget: list
                summary: '{{label}}: {{value}}'
                fields:
                  - { label: Row Label, name: label, widget: string }
                  - { label: Row Value, name: value, widget: string, hint: 'You can use **bold** here' }
          - label: Highlighted Note
            name: callout
            widget: object
            required: false
            hint: 'An optional highlighted callout box, e.g. a framing note or a warning'
            fields:
              - { label: Note Title, name: title, widget: string, hint: 'e.g. "Framing note"' }
              - { label: Note Text, name: text, widget: text }
