<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <script>
      // Send signed-out visitors straight to the email/password login page
      // instead of Sveltia's GitHub-branded splash screen. Two cases must NOT
      // redirect: a returning session (Sveltia has a cached token and will
      // sign in automatically), and a fresh arrival from the login page's
      // magic-link redirect (`#/signin/...`), which Sveltia needs to consume
      // itself to complete sign-in.
      (() => {
        const hasCachedSession = !!localStorage.getItem('sveltia-cms.user');
        const isMagicLinkReturn = location.hash.startsWith('#/signin/');

        if (!hasCachedSession && !isMagicLinkReturn) {
          location.replace('https://portfolio-cms-auth.3bda-as.workers.dev/login');
        }
      })();
    </script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
