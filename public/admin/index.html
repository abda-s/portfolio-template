<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
    <script>
      // Skip Sveltia's branded "Sign In with GitHub" splash screen and go
      // straight to our email/password login form (the button opens the
      // popup that portfolio-cms-auth serves that form in). Sveltia renders
      // this button client-side, so poll briefly until it exists.
      (() => {
        const AUTO_CLICK_TIMEOUT_MS = 5000;
        const POLL_INTERVAL_MS = 100;
        const startedAt = Date.now();

        const clickSignInButton = () => {
          const button = [...document.querySelectorAll('button')].find((el) =>
            el.textContent?.trim().startsWith('Sign In with'),
          );

          if (button) {
            button.click();
            return;
          }

          if (Date.now() - startedAt < AUTO_CLICK_TIMEOUT_MS) {
            setTimeout(clickSignInButton, POLL_INTERVAL_MS);
          }
        };

        clickSignInButton();
      })();
    </script>
  </body>
</html>
