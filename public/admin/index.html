<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
    <style>
      /* Hide the signed-in GitHub avatar + username from the account menu
         in the top-right corner. The client only ever sees this via the
         portfolio-cms-auth login flow — they never had a GitHub account —
         so showing "Signed In as <our-github-username>" would be
         confusing/wrong branding, not theirs to see. Everything else in
         that menu (Settings, Keyboard Shortcuts, Sign In with Mobile,
         Sign Out) is left alone. The "Live Site" item is also hidden —
         clients open the live site from their own browser, not from
         inside the CMS — but that one's handled in the script below, not
         here; see the comment there for why.

         The avatar rule is pinned to Sveltia's real markup (verified
         against its source: account-button.svelte) — img.avatar/
         button.avatar in the toolbar's last button group. If a future
         Sveltia update renames these, this silently stops applying
         instead of breaking anything. */
      .sui.toolbar .buttons:last-child img.avatar {
        display: none;
      }

      .sui.toolbar .buttons:last-child button.avatar::after {
        content: 'account_circle';
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        font-feature-settings: 'liga';
      }
    </style>
  </head>
  <body>
    <script>
      // Hides the "Signed In as <github-username>" row and the "Live Site"
      // row from the account dropdown (top-right corner). Not CSS, because
      // Sveltia's own Menu component has a real bug: it sets
      // aria-label="Account" on the dropdown's wrapper, but that attribute
      // gets silently clobbered by a later, conflicting attribute binding
      // in the same component (verified against its source), so the
      // rendered element never actually carries that label. On top of
      // that, the dropdown's content is portaled into a shared container
      // elsewhere in the DOM, not nested under the toolbar button — so
      // there's no stable structural CSS selector that reaches only this
      // one menu without also matching the first item of every other
      // dropdown in the CMS (locale pickers, the "+" create menu, etc).
      //
      // This keys off the fixed English strings Sveltia renders for these
      // two items instead — reliable as long as the CMS UI stays in
      // English, which it always is here (nothing in this setup lets a
      // client switch it). A MutationObserver is required because the
      // dropdown's contents are only mounted to the DOM while it's open,
      // freshly, every time it's opened.
      (() => {
        const SIGNED_IN_AS_PREFIX = 'Signed In as';
        const LIVE_SITE_LABEL = 'Live Site';

        const hideAccountMenuExtras = () => {
          document.querySelectorAll('[role="menuitem"]').forEach((item) => {
            if (!item.textContent?.trim().startsWith(SIGNED_IN_AS_PREFIX)) return;

            const signedInRow = item.closest('.sui.menuitem') ?? item;
            const divider = signedInRow.nextElementSibling;
            const liveSiteRow = divider?.nextElementSibling;

            signedInRow.style.display = 'none';

            if (divider?.classList.contains('divider')) {
              divider.style.display = 'none';
            }

            if (liveSiteRow?.textContent?.trim() === LIVE_SITE_LABEL) {
              liveSiteRow.style.display = 'none';
            }
          });
        };

        new MutationObserver(hideAccountMenuExtras).observe(document.body, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
    <script>
      // Send signed-out (or no-longer-actually-signed-in) visitors straight
      // to the email/password login page instead of Sveltia's GitHub-branded
      // splash screen. A fresh arrival from the login page's magic-link
      // redirect (`#/signin/...`) is left alone either way, since Sveltia
      // needs to consume that itself to complete sign-in.
      //
      // A cached session is only trusted after confirming its GitHub token
      // still works. A stale/expired/revoked token left in localStorage
      // (e.g. from an old sign-in flow, or a token that was later rotated)
      // would otherwise make Sveltia silently fail its own auto-login and
      // fall back to its GitHub-branded screen with no way back to this
      // login page short of clearing storage by hand.
      //
      // Sveltia's own script is only loaded (below) after this check
      // resolves, so it can never read a token we're about to clear.
      (async () => {
        const LOGIN_URL = 'https://portfolio-cms-auth.3bda-as.workers.dev/login';

        const loadSveltia = () => {
          const script = document.createElement('script');

          script.src = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';
          script.type = 'module';
          document.body.appendChild(script);
        };

        if (location.hash.startsWith('#/signin/')) {
          loadSveltia();
          return;
        }

        let cachedUser;

        try {
          cachedUser = JSON.parse(localStorage.getItem('sveltia-cms.user') ?? 'null');
        } catch {
          cachedUser = null;
        }

        if (!cachedUser?.token) {
          location.replace(LOGIN_URL);
          return;
        }

        try {
          const response = await fetch('https://api.github.com/user', {
            headers: { Authorization: `Bearer ${cachedUser.token}` },
          });

          if (response.ok) {
            loadSveltia(); // Token still valid; let Sveltia sign in automatically.
            return;
          }
        } catch {
          // Network error reaching GitHub: fall through and treat as invalid
          // rather than get stuck, since Sveltia's own API calls would fail
          // the same way regardless.
        }

        localStorage.removeItem('sveltia-cms.user');
        location.replace(LOGIN_URL);
      })();
    </script>
  </body>
</html>
